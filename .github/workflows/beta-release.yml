name: Beta Release

on:
  push:
    tags:
      - "v*-beta*"

permissions:
  contents: write

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*Setup*.exe
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - build-win

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-installers-arm64
          path: release-assets/mac/arm64

      - name: Download macOS artifacts (Intel)
        uses: actions/download-artifact@v4
        with:
          name: mac-installers-x64
          path: release-assets/mac/x64

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-assets/win

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/mac/**/*.dmg
            release-assets/win/*.exe
